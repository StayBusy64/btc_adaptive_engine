project:
  name: btc_adaptive_engine
  symbol: BTCUSDT.P
  timeframe: 1m

database:
  url: sqlite:///database/system.db

server:
  host: 127.0.0.1
  port: 8000

model:
  retrain_interval_minutes: 30
  min_samples: 300

decay:
  time_rate: 0.002
  performance_rate: 0.004
  regime_penalty: 0.50

risk:
  max_position_size: 0.02
  drawdown_limit: 0.08
