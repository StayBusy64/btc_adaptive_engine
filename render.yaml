services:
  - type: web
    name: btc-adaptive-engine-bridge
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SIGNAL_WEBHOOK_KEY
        sync: false
      - key: TRADINGVIEW_INGEST_SIGNAL_KEY
        sync: false
