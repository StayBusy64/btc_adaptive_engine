services:
  - type: web
    name: btc-adaptive-engine-bridge
    runtime: python
    plan: free
    rootDir: OneDrive/Desktop/btc_adaptive_engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.tradingview_bridge_standalone:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TV_SIGNAL_KEY
        sync: false
